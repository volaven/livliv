<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LivLiv marks</title>
<style>
  :root { color-scheme: dark; --bg:#16161a; --panel:#1e1e24; --line:#34343e; --ink:#e7e7ee; --dim:#9a9aa8; --key:#6fd3ff; }
  * { box-sizing: border-box }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.5 system-ui, sans-serif; display:flex; height:100vh }
  aside { width:300px; flex:none; background:var(--panel); border-right:1px solid var(--line); padding:14px; overflow:auto }
  main { flex:1; display:flex; align-items:center; justify-content:center; overflow:auto; padding:12px }
  canvas { background:#0e0e12; border-radius:8px; touch-action:none; max-width:100%; max-height:calc(100vh - 24px) }
  h1 { font-size:15px; margin:0 0 10px }
  select, button { font:inherit; color:var(--ink); background:#2a2a33; border:1px solid var(--line); border-radius:6px; padding:6px 9px }
  button { cursor:pointer } button:hover { border-color:var(--key) }
  button.go { background:var(--key); color:#06202b; border-color:var(--key); font-weight:600 }
  .row { display:flex; gap:6px; margin:8px 0; flex-wrap:wrap }
  ul { list-style:none; margin:10px 0; padding:0 }
  li { display:flex; align-items:center; gap:8px; padding:4px 6px; border-radius:6px; cursor:pointer }
  li:hover { background:#2a2a33 } li.on { background:#2a2a33; outline:1px solid var(--key) }
  .sw { width:12px; height:12px; border-radius:3px; flex:none }
  .dim { color:var(--dim); font-size:12px }
  pre { background:#13131a; border:1px solid var(--line); border-radius:6px; padding:8px; font-size:11px;
        white-space:pre-wrap; max-height:150px; overflow:auto; color:var(--dim) }
</style>
<aside>
  <h1>Marks</h1>
  <select id="who" style="width:100%"></select>
  <div class="row">
    <button id="save">Save marks</button>
    <button id="run" class="go">Convert again</button>
  </div>
  <p class="dim" id="hint">Drag a shape to move it, a corner to resize it. Arrow keys nudge the one you picked;
     hold shift for ten pixels at a time.</p>
  <ul id="list"></ul>
  <div class="row">
    <button id="addbrows">Add brows</button>
    <button id="delbrows">Drop brows</button>
  </div>
  <pre id="log">Pick a character.</pre>
</aside>
<main><canvas id="c"></canvas></main>
<script type="module">
const COLORS = { head:'#5ac8ff', face:'#ffd25a', eyes:'#78ff8c', brows:'#ff8cdc', mouth:'#ff6e6e',
                 chest:'#b4b4c8', neck_y:'#ffffff', hair_root_y:'#a0a0ff' }
const $ = (s) => document.querySelector(s)
const cv = $('#c'), g = cv.getContext('2d')
let id = null, marks = null, img = null, scale = 1, items = [], pick = null, drag = null

const log = (t) => { $('#log').textContent = t }

async function list() {
  const cs = await (await fetch('/api/characters')).json()
  $('#who').innerHTML = cs.map((c) => `<option value="${c.id}">${c.name} (${c.id})</option>`).join('')
    || '<option value="">nothing converted yet</option>'
  if (cs.length) open(cs[0].id)
}

async function open(which) {
  id = which
  marks = await (await fetch(`/my-characters/marks/${id}.json?t=${Date.now()}`)).json()
  img = new Image()
  img.src = `/my-characters/out/${id}/_canvas.webp?t=${Date.now()}`
  await img.decode()
  const [w, h] = marks.canvas
  scale = Math.min(1, (innerHeight - 40) / h, (innerWidth - 360) / w)
  cv.width = Math.round(w * scale); cv.height = Math.round(h * scale)
  build(); draw()
  log(`${id}: ${w}x${h}` + (marks.guessed?.length ? `, guessed: ${marks.guessed.join(', ')}` : ''))
}

/** every shape as a thing that can be read, moved and resized */
function build() {
  items = []
  const box = (key, i) => ({
    key, i, kind: 'box', color: COLORS[key],
    get: () => (i == null ? marks[key] : marks[key][i]),
    set: (v) => { if (i == null) marks[key] = v; else marks[key][i] = v },
  })
  items.push({ key: 'head', kind: 'ellipse', color: COLORS.head })
  items.push(box('face'))
  marks.eyes.forEach((_, i) => items.push(box('eyes', i)))
  ;(marks.brows || []).forEach((_, i) => items.push(box('brows', i)))
  items.push(box('mouth'))
  items.push({ key: 'chest', kind: 'ellipse', color: COLORS.chest })
  items.push({ key: 'neck_y', kind: 'line', color: COLORS.neck_y })
  items.push({ key: 'hair_root_y', kind: 'line', color: COLORS.hair_root_y })
  $('#list').innerHTML = items.map((it, n) =>
    `<li data-n="${n}"><span class="sw" style="background:${it.color}"></span>${it.key}${it.i != null ? ' ' + (it.i + 1) : ''}</li>`).join('')
  $('#list').querySelectorAll('li').forEach((li) => li.onclick = () => { pick = items[+li.dataset.n]; draw() })
}

const S = (v) => v * scale
function rect(it) {
  if (it.kind === 'box') { const b = it.get(); return { x: b[0], y: b[1], w: b[2] - b[0], h: b[3] - b[1] } }
  if (it.kind === 'ellipse') { const e = marks[it.key]; return { x: e.cx - e.rx, y: e.cy - e.ry, w: 2 * e.rx, h: 2 * e.ry } }
  return { x: 0, y: marks[it.key] - 3, w: marks.canvas[0], h: 6 }
}
function setRect(it, r) {
  if (it.kind === 'box') return it.set([r.x, r.y, r.x + r.w, r.y + r.h].map((v) => Math.round(v)))
  if (it.kind === 'ellipse') {
    const e = marks[it.key]
    e.cx = +(r.x + r.w / 2).toFixed(1); e.cy = +(r.y + r.h / 2).toFixed(1)
    e.rx = +Math.max(4, r.w / 2).toFixed(1); e.ry = +Math.max(4, r.h / 2).toFixed(1)
    return
  }
  marks[it.key] = +(r.y + 3).toFixed(1)
}

function draw() {
  g.clearRect(0, 0, cv.width, cv.height)
  g.drawImage(img, 0, 0, cv.width, cv.height)
  for (const it of items) {
    const r = rect(it), on = it === pick
    g.lineWidth = on ? 3 : 1.5
    g.strokeStyle = it.color
    g.setLineDash(it.kind === 'line' ? [7, 5] : [])
    if (it.kind === 'ellipse') {
      g.beginPath(); g.ellipse(S(r.x + r.w / 2), S(r.y + r.h / 2), S(r.w / 2), S(r.h / 2), 0, 0, 7); g.stroke()
    } else if (it.kind === 'line') {
      g.beginPath(); g.moveTo(0, S(r.y + 3)); g.lineTo(cv.width, S(r.y + 3)); g.stroke()
    } else {
      g.strokeRect(S(r.x), S(r.y), S(r.w), S(r.h))
    }
    if (on && it.kind !== 'line') {
      g.setLineDash([]); g.fillStyle = it.color
      for (const [hx, hy] of corners(r)) g.fillRect(S(hx) - 4, S(hy) - 4, 8, 8)
    }
  }
}
const corners = (r) => [[r.x, r.y], [r.x + r.w, r.y], [r.x, r.y + r.h], [r.x + r.w, r.y + r.h]]

function at(x, y) {
  if (pick && pick.kind !== 'line') {
    const r = rect(pick)
    for (const [i, [hx, hy]] of corners(r).entries()) {
      if (Math.abs(S(hx) - S(x)) < 7 && Math.abs(S(hy) - S(y)) < 7) return { it: pick, corner: i }
    }
  }
  for (const it of [...items].reverse()) {
    const r = rect(it)
    if (x >= r.x - 3 && x <= r.x + r.w + 3 && y >= r.y - 3 && y <= r.y + r.h + 3) return { it, corner: -1 }
  }
  return null
}

cv.addEventListener('pointerdown', (e) => {
  const b = cv.getBoundingClientRect()
  const x = (e.clientX - b.left) / scale * (cv.width / b.width), y = (e.clientY - b.top) / scale * (cv.height / b.height)
  const hit = at(x, y)
  if (!hit) { pick = null; draw(); return }
  pick = hit.it; drag = { ...hit, x, y, start: rect(hit.it) }
  cv.setPointerCapture(e.pointerId); draw()
})
cv.addEventListener('pointermove', (e) => {
  if (!drag) return
  const b = cv.getBoundingClientRect()
  const x = (e.clientX - b.left) / scale * (cv.width / b.width), y = (e.clientY - b.top) / scale * (cv.height / b.height)
  const dx = x - drag.x, dy = y - drag.y, s = drag.start
  if (drag.corner < 0) setRect(drag.it, { ...s, x: s.x + dx, y: s.y + dy })
  else {
    const x0 = drag.corner % 2 ? s.x : s.x + dx, x1 = drag.corner % 2 ? s.x + s.w + dx : s.x + s.w
    const y0 = drag.corner < 2 ? s.y + dy : s.y, y1 = drag.corner < 2 ? s.y + s.h : s.y + s.h + dy
    setRect(drag.it, { x: Math.min(x0, x1), y: Math.min(y0, y1), w: Math.abs(x1 - x0), h: Math.abs(y1 - y0) })
  }
  draw()
})
addEventListener('pointerup', () => { drag = null })
addEventListener('keydown', (e) => {
  if (!pick || !e.key.startsWith('Arrow')) return
  const d = e.shiftKey ? 10 : 1, r = rect(pick)
  setRect(pick, { ...r, x: r.x + (e.key === 'ArrowRight' ? d : e.key === 'ArrowLeft' ? -d : 0),
                        y: r.y + (e.key === 'ArrowDown' ? d : e.key === 'ArrowUp' ? -d : 0) })
  e.preventDefault(); draw()
})

$('#who').onchange = (e) => open(e.target.value)
$('#save').onclick = async () => {
  marks.guessed = []
  const r = await fetch(`/api/marks?id=${id}`, { method: 'PUT', body: JSON.stringify(marks) })
  log(JSON.stringify(await r.json()))
}
$('#run').onclick = async () => {
  marks.guessed = []
  await fetch(`/api/marks?id=${id}`, { method: 'PUT', body: JSON.stringify(marks) })
  log('converting…')
  const r = await (await fetch(`/api/convert?id=${id}`, { method: 'POST' })).json()
  log(r.log || JSON.stringify(r))
  await open(id)
}
$('#addbrows').onclick = () => {
  const [a, b] = marks.eyes
  const lift = (e) => [e[0], Math.round(e[1] - (e[3] - e[1]) * 1.1), e[2], Math.round(e[1] - (e[3] - e[1]) * 0.25)]
  marks.brows = [lift(a), lift(b)]; build(); draw()
}
$('#delbrows').onclick = () => { marks.brows = []; build(); draw() }
list()
</script>
